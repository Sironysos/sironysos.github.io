<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blog de recettes de cuisine : parcourez les recettes par tag, par ingrédient et par saison."
    />
    <title>Recettes — Blog de cuisine</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="liste">
    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html">
          <h1 class="brand-title">Mes recettes</h1>
        </a>
        <a class="back-link" href="../index.html">&larr; Retour à l'accueil</a>
      </div>
    </header>

    <div class="container">
      <div class="toolbar">
        <button
          type="button"
          id="filters-toggle"
          class="filters-toggle"
          aria-expanded="false"
          aria-controls="filters"
        >
          Filtres
        </button>
      </div>

      <div class="layout">
        <!-- Colonne de filtres -->
        <aside
          class="filters"
          id="filters"
          aria-label="Filtres de recherche"
        >
          <h2>Filtres</h2>

          <div class="filter-group">
            <fieldset>
              <legend>Tags</legend>
              <div class="chip-list" id="filtre-tags" role="group"></div>
            </fieldset>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="filtre-ingredient">Ingrédient</label>
            <select class="select-input" id="filtre-ingredient">
              <option value="">Tous les ingrédients</option>
            </select>
          </div>

          <div class="filter-group">
            <span class="filter-label">Saison</span>
            <div class="season-row">
              <input type="checkbox" id="filtre-saison" class="season-toggle" />
              <label for="filtre-saison">
                De saison en <strong id="mois-courant">ce mois</strong>
              </label>
            </div>
            <p class="season-hint">
              Affiche les recettes ayant au moins un ingrédient de saison ce
              mois-ci.
            </p>
          </div>

          <button type="button" id="reset" class="reset-btn">
            Réinitialiser les filtres
          </button>
        </aside>

        <!-- Grille de résultats -->
        <main class="results">
          <div class="results-head">
            <h2>Recettes</h2>
            <span class="results-count" id="results-count" aria-live="polite"></span>
          </div>

          <div class="state" id="etat" role="status">Chargement…</div>

          <ul class="grid" id="grid" aria-label="Liste des recettes"></ul>
        </main>
      </div>
    </div>

    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear());</script> Sironysos</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
