<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blog de recettes de cuisine : parcourez les recettes par tag, par ingrédient et par saison."
    />
    <title>Recettes - Blog de cuisine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    data-page="liste"
    data-layout-title="Mes recettes"
    data-layout-brand-href="recettes.html"
    data-layout-back-href="../index.html"
    data-layout-back-label="← Retour à l'accueil"
    data-layout-footer-name="Sironysos"
  >
    <div data-layout-header></div>

    <main class="site-main">
      <div class="container">
        <div class="toolbar">
          <button
            type="button"
            id="filters-toggle"
            class="filters-toggle"
            aria-expanded="false"
            aria-controls="filters"
          >
            Filtres
          </button>
        </div>

        <div class="layout">
          <aside class="filters" id="filters" aria-label="Filtres de recherche">
            <h2>Filtres</h2>

            <div class="filter-group">
              <fieldset>
                <legend>Tags</legend>
                <div class="chip-list" id="filtre-tags" role="group"></div>
              </fieldset>
            </div>

            <div class="filter-group">
              <label class="filter-label" for="filtre-ingredient"
                >Ingrédient</label
              >
              <div class="ingredient-filter" id="ingredient-filter">
                <input
                  class="text-input"
                  type="text"
                  id="filtre-ingredient"
                  autocomplete="off"
                  placeholder="Tapez un ingredient"
                  aria-autocomplete="list"
                  aria-controls="ingredient-suggestions"
                  aria-expanded="false"
                />
                <div
                  class="ingredient-selected"
                  id="ingredient-selected"
                  aria-label="Ingrédients sélectionnés"
                ></div>
                <div
                  class="ingredient-suggestions"
                  id="ingredient-suggestions"
                  role="listbox"
                  aria-label="Suggestions d'ingrédients"
                ></div>
              </div>
            </div>

            <div class="filter-group">
              <span class="filter-label">Saison</span>
              <div class="season-row">
                <input
                  type="checkbox"
                  id="filtre-saison"
                  class="season-toggle"
                />
                <label for="filtre-saison">
                  De saison en <strong id="mois-courant">ce mois</strong>
                </label>
              </div>
              <p class="season-hint">
                Affiche les recettes ayant au moins un ingredient de saison ce
                mois-ci.
              </p>
            </div>

            <button type="button" id="reset" class="reset-btn">
              Réinitialiser les filtres
            </button>
          </aside>

          <section class="results" aria-label="Resultats des recettes">
            <div class="results-head">
              <h2>Recettes</h2>
              <span
                class="results-count"
                id="results-count"
                aria-live="polite"
              ></span>
            </div>

            <div class="state" id="etat" role="status">Chargement...</div>

            <ul class="grid" id="grid" aria-label="Liste des recettes"></ul>
          </section>
        </div>
      </div>
    </main>

    <div data-layout-footer></div>

    <script src="app.js"></script>
    <script src="../layout.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
